# Production stack (RNF-06): backend, PostgreSQL and Caddy, which serves the web and is the only service
# that publishes ports. Configuration comes from the .env next to this file (see .env.example).
# docker compose --env-file .env -f docker-compose.prod.yml up -d --wait
# Fixed, so volumes and containers do not depend on the directory name (nor clash with the dev stack).
name: buddy-fantasy-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/xosebabio/buddy-fantasy-backend:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # A literal, not from the .env, so the e2e profile cannot reach production by mistake.
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}

  caddy:
    image: ghcr.io/xosebabio/buddy-fantasy-web:${IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
      # No photos in production for now: the CSP origins stay empty.
      PHOTOS_ORIGIN: ""
      UPLOADS_ORIGIN: ""
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data # certificates: losing them forces new Let's Encrypt issuances
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

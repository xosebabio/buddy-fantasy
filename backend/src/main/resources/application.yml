spring:
  application:
    name: buddy-fantasy
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/buddyfantasy}
    username: ${DB_USER:buddyfantasy}
    password: ${DB_PASSWORD:buddyfantasy}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never # las tablas las crea Flyway (V4__identity_spring_session.sql)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            scope: openid,profile,email
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false # la tabla event_publication la crea Flyway (V1__baseline.sql)

server:
  forward-headers-strategy: framework # redirect_uri correcto detrás de Caddy
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

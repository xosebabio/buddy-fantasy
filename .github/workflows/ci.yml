name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Testcontainers uses the Docker daemon available on the runner
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Generated and versioned files (FE-05, decisions 6 and 7 of plan 11): they must be up to date.
      # The backend job checks api/openapi.json, and i18n:extract fails on a repeated or malformed id.
      - run: npm run api:types
      - run: npm run palette
      - run: npm run i18n:extract
      - run: git diff --exit-code -- src/app/core/api/schema.d.ts src/app/ui/styles/_palette.scss src/locale/messages.xlf
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Smoke E2E (FE-34): the real backend with the e2e profile and the production build served by Caddy,
  # as in production, so routes, headers and CSP are checked too.
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose -f deploy/docker-compose.dev.yml up -d --wait postgres
      - name: Start the backend with the e2e profile
        working-directory: backend
        run: |
          mvn -B -q package -DskipTests -Djacoco.skip=true
          SPRING_PROFILES_ACTIVE=e2e nohup java -jar target/buddy-fantasy-backend-*.jar > backend.log 2>&1 &
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: docker compose -f deploy/docker-compose.dev.yml --profile caddy up -d caddy
      - name: Wait for the backend behind Caddy
        run: timeout 120 sh -c 'until curl -sf http://localhost:8081/actuator/health; do sleep 2; done'
      - name: Install the browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Run the E2E
        working-directory: frontend
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/backend.log
